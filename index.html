<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <!-- Connessione ANTICIPATA ai servizi Google (nessuna richiesta parte prima:
         sono solo hint DNS/TCP/TLS). Senza questi l'app scarica prima ~280 KB di
         JS e solo DOPO apre la WebSocket Firestore: DNS + TLS finivano in coda,
         100-400 ms sul 4G.
         Tutti questi host sono ammessi da connect-src (vite.config.js) per il
         wildcard *.googleapis.com o per voce esatta: un preconnect su un host
         che connect-src vieta NON serve a nulla, perché la connessione non può
         essere riusata. apis.google.com, per esempio, sta in default-src ma non
         in connect-src, e serve il popup Auth via script: niente XHR, quindi niente
         preconnect.
         crossorigin è NECESSARIO su firestore/identitytoolkit: senza, l'hint
         aprirebbe una connessione non riusabile da fetch()/XHR (che sono
         CORS-mode) e il guadagno sarebbe nullo. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <!-- Solo DNS: host usati una volta sola (installazione, token, iframe Auth). -->
    <link rel="dns-prefetch" href="https://firebaseinstallations.googleapis.com" />
    <link rel="dns-prefetch" href="https://securetoken.googleapis.com" />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />
    <meta
      name="description"
      content="ScuolaBoard: la bacheca digitale della classe per avvisi, lezioni, quiz, sondaggi, commenti e assistente AI."
    />
    <meta property="og:title" content="ScuolaBoard" />
    <meta
      property="og:description"
      content="La bacheca digitale della classe: avvisi, lezioni, quiz, sondaggi e discussioni."
    />
    <meta property="og:type" content="website" />
    <!-- PWA -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ScuolaBoard" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>"
    />
    <title>ScuolaBoard — Bacheca digitale della classe</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var o = console.log;
        console.log = function () {
          if (typeof arguments[0] === 'string' && arguments[0].indexOf('Download the React DevTools') >= 0) return;
          o.apply(console, arguments);
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
