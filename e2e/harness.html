<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScuolaBoard — Harness E2E</title>
    <!-- Evita la richiesta 404 a /favicon.ico (sarebbe un errore console nel test) -->
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        background: #1a1a2e;
        font-family: Inter, sans-serif;
      }
      /* L'harness non carica src/styles.css: qui replico l'alone animato del
         sigillo privacy, altrimenti in questa pagina (e nella Preview) il badge
         resterebbe fermo. In produzione la chiave sta in styles.css. */
      @keyframes privacy-seal-glow {
        0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,.60), 0 2px 8px rgba(16,185,129,.35); }
        50% { box-shadow: 0 0 0 6px rgba(34,197,94,0), 0 2px 14px rgba(34,197,94,.60); }
      }
      @keyframes guida-seal-glow {
        0%,100% { box-shadow: 0 0 0 0 rgba(139,92,246,.55), 0 2px 8px rgba(99,102,241,.35); }
        50% { box-shadow: 0 0 0 6px rgba(139,92,246,0), 0 2px 14px rgba(168,85,247,.55); }
      }
      /* Anche l'alone del badge "avviso non inviato" (ambra) vive in styles.css. */
      @keyframes card-avviso-glow {
        0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,.55), 0 2px 8px rgba(245,158,11,.25); }
        50% { box-shadow: 0 0 0 5px rgba(245,158,11,0), 0 2px 12px rgba(245,158,11,.45); }
      }
      .card-avviso { animation: card-avviso-glow 2.2s ease-in-out infinite; }
      .annunci-sospesi { animation: card-avviso-glow 2.6s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <!-- L'app vera viene montata qui da harness-boot.ts con Firebase finto -->
    <div id="root"></div>
    <script type="module" src="./harness-boot.ts"></script>
  </body>
</html>
