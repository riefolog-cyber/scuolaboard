# CI · ScuolaBoard
# Validazione automatica a ogni push/PR su main: lint, typecheck, test unit,
# build di produzione e test E2E. Il deploy su GitHub Pages resta automatico:
# Pages serve la cartella /docs committata su main (Settings → Pages → branch
# main, folder /docs).
# Il job "deploy-docs" rigenera e committa automaticamente docs/ a ogni push su
# main che supera tutti i controlli: nessun "npm run build" manuale.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serializza i run sullo stesso ramo: evita che due push ravvicinati facciano
# competere tra loro i commit automatici di docs/ (il run più vecchio finisce,
# i successivi restano in coda).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint + Typecheck + Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Typecheck: tutto il codice gira con `strict: true` (tsconfig.json);
      # la migrazione strict incrementale è completata.
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit & integration tests
        run: npm test
      # Threshold di coverage (configurato in vitest.config.js): fallisce se la
      # copertura scende sotto la soglia (baseline 01/09/2026: lines 72%, stmts 71%).
      - name: Coverage threshold
        run: npx vitest run --coverage --coverage.reporter=text-summary

  build:
    name: Build di produzione (docs/)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verifica output (docs/index.html)
        run: test -f docs/index.html && test -f docs/manifest.webmanifest && test -f docs/sw.js && echo "Build OK"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/
          retention-days: 7

  e2e:
    name: Test E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installa browser (Chromium)
        run: npx playwright install --with-deps chromium
      # Serve la build di produzione su 4173 (test "PROD 4173"):
      # il preview (vite preview) serve la cartella docs/ appena generata.
      - name: Build di produzione (per il test PROD 4173)
        run: npm run build
      - name: Esegui E2E
        run: npm run test:e2e

  deploy-docs:
    name: Rigenera e committa docs/ (deploy Pages)
    runs-on: ubuntu-latest
    needs: [test, build, e2e]
    # Solo su push a main, mai su PR. Il commit automatico usa il token del
    # workflow (github-actions[bot]); i push fatti con GITHUB_TOKEN non
    # ri-triggerano altri run, quindi niente loop.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rigenera docs/ (build di produzione)
        run: npm run build
      - name: Committa e pusha docs/ se modificata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "✓ docs/ già aggiornata: nessun commit necessario"
          else
            git commit -m "build(docs): rigenerazione automatica da CI [skip ci]"
            # Se nel frattempo è arrivato un push diretto su main, rebase locale
            # prima di pushare (come fa scripts/deploy.sh): evita non-fast-forward.
            git pull --rebase origin main
            git push origin main
            echo "✓ docs/ rigenerata e pushatta su main"
          fi
