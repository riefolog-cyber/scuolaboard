# test-budget-notte.yml — il cruscotto dei test lenti, una volta al giorno.
#
# PERCHÉ NON È UN GATE: `npm run test:budget` fa girare la suite con metà dei core
# occupati e sotto carico può essere rosso di proposito. In CI bloccherebbe i
# push per motivi che non riguardano il commit. Qui invece gira di notte e, se
# un test supera il budget, apre (o aggiorna) UNA issue: il numero non passa
# inosservato, ma nessuno viene bloccato.
name: Test budget (notturno)

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC, fuori dagli orari scolastici
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Un run alla volta: due esecuzioni sovrapposte (cron + dispatch) commenterebbero
# due volte la stessa issue senza aggiungere informazione.
concurrency:
  group: test-budget-notte
  cancel-in-progress: false

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Stessa versione della CI (e di `engines.node`): il budget deve misurare
          # lo stesso runtime che gira sui PR, non l'ultima patch della major.
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - name: Budget dei test sotto carico
        id: budget
        continue-on-error: true
        # `tee` + pipefail: il log serve all'artifact, ma l'exit code resta quello
        # di `test:budget` (GitHub usa già `bash -eo pipefail`; esplicito perché
        # senza, l'esito verrebbe da `tee` e il job sarebbe sempre verde).
        run: |
          set -o pipefail
          npm run test:budget 2>&1 | tee budget.log
      - name: Allega il report del budget
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-budget
          path: budget.log
          if-no-files-found: warn
          retention-days: 14
      - name: Segnala i test oltre il budget
        if: steps.budget.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const titolo = 'Test lenti oltre il budget (job notturno)';
            const corpo = [
              'Il job notturno `test:budget` ha trovato almeno un test oltre il budget con la CPU sotto carico.',
              '',
              'Vedi il run: ' + `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Cosa fare: `npm run test:budget` in locale, poi guarda quale test è sopra l\'80%.',
              'Di solito è il primo test di un file di integrazione (paga l\'import) o un\'attesa che non è stata misurata.',
            ].join('\n');
            // `search`, non `listForRepo`: quest'ultimo si ferma a 100 issue per
            // pagina, e oltre quella soglia l'issue esistente non verrebbe
            // trovata (una nuova issue identica a ogni notte).
            const trovati = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${titolo}"`,
              per_page: 10,
            });
            const gia = trovati.data.items.find((i) => i.title === titolo);
            if (gia) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: gia.number,
                body: corpo,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titolo,
                body: corpo,
              });
            }
